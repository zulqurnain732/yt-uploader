name: Video Auto Upload

on:
  push:
    branches: [ main, master ]
    paths:
      - 'uploader.py'
      - '.github/workflows/upload_video.yml'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth requests

      - name: Run Video Upload
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python uploader.py video
